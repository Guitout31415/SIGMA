[Thresholds]
min_genes_detected = 3 # Minimum number of candidate genes to detect to consider a cell as a candidate
gene_detection_threshold = 2 # Expression threshold to consider a gene as expressed
n_components_target = kde # components for the target GMM: kde (KDE peak detection) | bic (BIC elbow) | integer
n_components_exclu = kde # components for the excluded GMM: kde (KDE peak detection) | bic (BIC elbow) | integer
min_mean_expression = 2 # minimum mean expression level for the higher component can be considered as target cluster.

[Folder]
